[package]
name = "pg-conn-bench"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Times each step of a PostgreSQL connection (DNS, TCP, TLS, authentication) and flags network stalls"
license = "GPL-3.0-only"
repository = "https://github.com/bixority/pg-conn-bench"
readme = "README.md"
publish = ["bixority-codeberg"]
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
keywords = ["postgresql", "benchmark", "latency", "network", "tcp"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
fallible-iterator = "0.3.0"
libc = "0.2.191"
postgres-protocol = "0.6.12"
rustls = "0.23.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.12"
