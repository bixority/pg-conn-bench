name: CI

# Lint, test and build on every push to main, on pull requests and on version
# tags, on Codeberg's hosted runners. On a version tag (v<Cargo.toml version>,
# e.g. v0.1.0) the crate is then published to the bixority cargo registry on
# Codeberg (index: https://codeberg.org/bixority/_cargo-index).
#
# aws-lc-sys (rustls' crypto backend) needs a C compiler and cmake on top of
# the slim Rust image.
#
# Required repository secret (Settings -> Actions -> Secrets), used only by the
# publish job:
#   CODEBERG_TOKEN - Codeberg access token with the write:package scope, owned
#                    by a user who may publish packages for the bixority org.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  # Each tag is its own group, so a publish run is never cancelled by another push.
  cancel-in-progress: true

env:
  CARGO_HOME: /cargo-home
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: Lint, test and build
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1.99-slim-trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git nodejs
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /cargo-home/registry
            /cargo-home/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ forgejo.run_id }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock') }}-
            cargo-

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

  publish:
    name: Publish crate
    needs: check
    if: startsWith(forgejo.ref, 'refs/tags/v')
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1.99-slim-trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git nodejs
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Tag matches the crate version
        env:
          TAG: ${{ forgejo.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRIES_BIXORITY_CODEBERG_TOKEN: Bearer ${{ secrets.CODEBERG_TOKEN }}
        run: cargo publish --registry bixority-codeberg --locked
